name: Build launcher

# Builds and publishes the cross-platform NiceSwarm auto-update launcher.
#
# The launcher is DECOUPLED from the game release: the Windows build ships to its own
# rolling `launcher` tag — NOT the game's `latest` tag — and only rebuilds when
# launcher/** changes or on demand. So a normal game commit to `publish` does not
# republish the launcher.
#
# The launcher downloads the GAME from the `latest` tag at runtime (see launcher/);
# this workflow only distributes the launcher itself.
#
# Pinned `launcher-v*` tag releases are deliberately NOT wired here: combining a
# `tags:` trigger with the `paths:` filter below is a known footgun (the path filter
# also applies to tag pushes, which usually don't touch launcher/**, so the build
# silently skips). Add a dedicated tag workflow when pinned launcher releases are
# wanted — see LAUNCHER.md Phase 3.
on:
  push:
    branches:
      - publish
    paths:
      - "launcher/**"
      - ".github/workflows/build-launcher.yml"
  workflow_dispatch:

permissions:
  contents: write # softprops/action-gh-release creates/updates the launcher release

defaults:
  run:
    working-directory: launcher

jobs:
  # Windows binaries cross-compiled from Linux. The Gio (gioui.org) Windows backend is
  # pure-Go (Direct3D/syscall via golang.org/x/sys), so CGO_ENABLED=0 cross-compiles
  # cleanly for amd64 AND arm64 — verified locally. Tests run on internal/... only so
  # the Linux runner never compiles the Gio GUI package (its Linux backend would demand
  # cgo + X11/Wayland headers). This is the verified path and the one published to users.
  launcher-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — the version stamp uses `git rev-list --count HEAD` (shallow returns 1)
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true # gioui.org deps are recorded in go.sum now
          cache-dependency-path: launcher/go.sum # go.sum lives under launcher/, not repo root
      - name: Test
        run: go test ./internal/... # skip the GUI package: needs cgo+X11 on Linux
      - name: Cross-compile Windows binaries + checksums
        env:
          CGO_ENABLED: "0" # Gio's Windows backend is pure-Go; no cgo needed
          # Code-signing cert (optional): base64-encoded .pfx + its password. Set these
          # as repo Secrets (Settings -> Secrets and variables -> Actions). When absent
          # (forks, no cert yet) the signing step is skipped and the build still passes.
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          mkdir -p dist
          # Stamp the launcher's own build version (branch + commit count) via two -X vars —
          # the split avoids go tool link splitting an "-X main.version=Publish v. 220" value on
          # the space. Shown in the launcher window by launcherVersion().
          VER="-X main.verBranch=${GITHUB_REF_NAME} -X main.verCount=$(git rev-list --count HEAD)"
          # Embed Windows PE version metadata (CompanyName/ProductName/FileVersion/...).
          # A bare cross-compiled Go GUI exe with NO version resource is a classic
          # antivirus false-positive trigger; proper metadata makes it present as a
          # normal app. The .syso is gated by filename to windows/amd64 (the flagged
          # build); the arm64 build ignores it. goversioninfo is a pure-Go tool.
          go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.4.1 \
            -64 -o versioninfo_windows_amd64.syso versioninfo.json
          # -H=windowsgui: GUI subsystem, so no console window flashes beside the Gio window.
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H=windowsgui ${VER}" -o dist/NiceSwarm-Launcher.exe .
          GOOS=windows GOARCH=arm64 go build -trimpath -ldflags "-s -w -H=windowsgui ${VER}" -o dist/NiceSwarm-Launcher-arm64.exe .
          # Code-sign (optional): if the WINDOWS_CERT_* secrets are set, sign both exes
          # with osslsigncode (Linux) + an RFC3161 timestamp. Gated on the secret so
          # forks / no-cert builds still pass. Must run BEFORE the sha256 below so the
          # launcher's self-update hash matches the signed bytes it downloads. NOTE: only
          # a CA-issued OV/EV cert clears AV/SmartScreen — a self-signed cert signs fine
          # here but won't help end users.
          if [ -n "${WINDOWS_CERT_BASE64}" ]; then
            echo "Code-signing Windows binaries..."
            sudo apt-get update -qq && sudo apt-get install -y -qq osslsigncode
            echo "${WINDOWS_CERT_BASE64}" | base64 -d > "${RUNNER_TEMP}/cert.pfx"
            for exe in dist/NiceSwarm-Launcher.exe dist/NiceSwarm-Launcher-arm64.exe; do
              osslsigncode sign -pkcs12 "${RUNNER_TEMP}/cert.pfx" -pass "${WINDOWS_CERT_PASSWORD}" \
                -n "NiceSwarm Launcher" -i "https://hh.coffee" \
                -ts http://timestamp.sectigo.com \
                -in "$exe" -out "$exe.signed"
              mv "$exe.signed" "$exe"
            done
            rm -f "${RUNNER_TEMP}/cert.pfx"
            echo "Signed."
          else
            echo "WINDOWS_CERT_BASE64 secret not set — skipping code signing (unsigned build)."
          fi
          # SHA256 sidecars the launcher reads to detect that IT is outdated. sha256sum's
          # "<hash>  <filename>" output is exactly the sidecar format the launcher parses.
          ( cd dist && sha256sum NiceSwarm-Launcher.exe > NiceSwarm-Launcher.exe.sha256 )
          ( cd dist && sha256sum NiceSwarm-Launcher-arm64.exe > NiceSwarm-Launcher-arm64.exe.sha256 )
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: NiceSwarm-Launcher-windows
          path: launcher/dist/*
          if-no-files-found: error
      - name: Publish to rolling 'launcher' tag (publish branch)
        if: github.ref == 'refs/heads/publish'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher
          name: NiceSwarm Launcher (latest)
          body: Auto-built launcher from `publish` (${{ github.sha }}).
          prerelease: true
          files: launcher/dist/*

  # macOS universal launcher, wrapped in a minimal ad-hoc-signed .app, now PUBLISHED to
  # the `launcher` tag so the macOS self-update has a real asset to pull. Gio's macOS
  # backend REQUIRES cgo (AppKit + Metal), so each arch is built CGO_ENABLED=1; the
  # cross-arch (amd64) slice targets the universal SDK via `clang -arch`. The build is
  # CI-COMPILED on a real Mac VM but RUNTIME-UNVERIFIED on physical hardware (beta).
  # `needs: launcher-windows` serializes the two publishes so they don't race
  # creating/updating the shared `launcher` release. No continue-on-error: now that this
  # job PUBLISHES, a build/sign/sidecar/publish failure must fail loudly rather than ship
  # silently — Windows already published in its own job, so a red macOS job won't block it.
  launcher-macos:
    runs-on: macos-latest
    needs: launcher-windows
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — the version stamp uses `git rev-list --count HEAD` (shallow returns 1)
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true # gioui.org deps are recorded in go.sum now
          cache-dependency-path: launcher/go.sum # go.sum lives under launcher/, not repo root
      - name: Test
        run: go test ./internal/... # GUI package has no tests; internals are the suite
      - name: Build universal binary, wrap in .app, ad-hoc sign, zip
        run: |
          set -euo pipefail
          mkdir -p dist build
          # Stamp the launcher's own build version (branch + commit count); see the windows job.
          VER="-X main.verBranch=${GITHUB_REF_NAME} -X main.verCount=$(git rev-list --count HEAD)"
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 CC="clang -arch x86_64" go build -trimpath -ldflags "-s -w ${VER}" -o build/launcher_amd64 .
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w ${VER}" -o build/launcher_arm64 .
          lipo -create -output build/NiceSwarm-Launcher build/launcher_amd64 build/launcher_arm64
          app="build/NiceSwarm Launcher.app"
          mkdir -p "$app/Contents/MacOS"
          cp macos/Info.plist "$app/Contents/Info.plist"
          cp build/NiceSwarm-Launcher "$app/Contents/MacOS/NiceSwarm-Launcher"
          chmod +x "$app/Contents/MacOS/NiceSwarm-Launcher"
          codesign --force --deep --sign - "$app"
          # Sidecar MUST be hashed AFTER codesign (signing rewrites the Mach-O) and over
          # the INNER Mach-O — exactly what the launcher hashes (os.Executable()) at
          # runtime. Hashing the zip, or hashing pre-sign, would make every launcher
          # report itself perpetually outdated.
          inner_hash=$(shasum -a 256 "$app/Contents/MacOS/NiceSwarm-Launcher" | awk '{print $1}')
          echo "${inner_hash}  NiceSwarm-Launcher-macos.zip" > dist/NiceSwarm-Launcher-macos.zip.sha256
          ( cd build && zip -qr -y "../dist/NiceSwarm-Launcher-macos.zip" "NiceSwarm Launcher.app" )
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: NiceSwarm-Launcher-macos
          path: launcher/dist/*
          if-no-files-found: error
      - name: Publish to rolling 'launcher' tag (publish branch)
        if: github.ref == 'refs/heads/publish'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher
          name: NiceSwarm Launcher (latest)
          body: Auto-built launcher from `publish` (${{ github.sha }}).
          prerelease: true
          files: launcher/dist/*
