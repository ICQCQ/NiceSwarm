name: Build Windows EXE

# Builds the distributable Windows .exe (same steps as build.ps1) and publishes it.
# Runs on:
#   - push to `publish`  -> rolling "latest" prerelease (always-current dev build)
#   - version tags (v*)  -> attaches the exe to a versioned GitHub Release
#   - manual dispatch    -> uploads the exe as a downloadable artifact

on:
  push:
    branches:
      - publish
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # required for softprops/action-gh-release to create the release

jobs:
  export-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs the Godot editor + matching export templates. GDScript-only project,
      # so the non-.NET build is used. Bump `version` in lockstep with project.godot.
      - name: Set up Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true

      # Best-effort: lets Godot patch Windows exe metadata (file_version/product_name
      # from export_presets.cfg). If the runner's Godot is self-contained this file is
      # ignored and the export simply skips metadata patching with a warning — never fatal.
      - name: Configure rcedit for exe metadata (best effort)
        continue-on-error: true
        shell: pwsh
        run: |
          curl -L -o rcedit.exe https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe
          $rcedit = ((Resolve-Path rcedit.exe).Path) -replace '\\','/'
          $dir = "$env:APPDATA\Godot"
          New-Item -ItemType Directory -Force $dir | Out-Null
          @"
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/windows/rcedit = "$rcedit"
          "@ | Out-File -Encoding utf8 "$dir\editor_settings-4.tres"

      # setup-godot symlinks `godot` to the GUI-subsystem Godot_*_win64.exe. Launched from
      # PowerShell that binary DETACHES and returns immediately, so a bare `godot ...` call
      # never blocks: the import races the export on .godot/, and the export hasn't finished
      # (or even started) when the verify step runs -> no exe, no output, ~1s, looks "silent".
      # Start-Process -Wait blocks on the process handle regardless of subsystem; redirecting
      # the streams to files (and printing them) keeps a real export error visible in one run.
      #
      # First run imports assets/resolves the global class_name cache (see CLAUDE.md); the
      # second run does the actual export. import can exit non-zero on benign warnings, so
      # don't gate the build on it.
      - name: Import project
        shell: pwsh
        run: |
          $p = Start-Process -FilePath godot -ArgumentList '--headless --path . --import' -NoNewWindow -Wait -PassThru -RedirectStandardOutput godot-import-out.txt -RedirectStandardError godot-import-err.txt
          Get-Content godot-import-out.txt, godot-import-err.txt -ErrorAction SilentlyContinue
          Write-Host "godot --import exit code: $($p.ExitCode)"
          exit 0

      - name: Export Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          $p = Start-Process -FilePath godot -ArgumentList '--headless --path . --export-release "Windows Desktop" "build/NiceSwarm.exe"' -NoNewWindow -Wait -PassThru -RedirectStandardOutput godot-export-out.txt -RedirectStandardError godot-export-err.txt
          Get-Content godot-export-out.txt, godot-export-err.txt -ErrorAction SilentlyContinue
          Write-Host "godot --export-release exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "godot export failed with exit code $($p.ExitCode)" }

      - name: Verify exe was produced
        shell: pwsh
        run: |
          if (-not (Test-Path "build/NiceSwarm.exe")) {
            throw "Export failed - no exe produced (check export templates)"
          }
          $mb = [math]::Round((Get-Item "build/NiceSwarm.exe").Length / 1MB, 1)
          Write-Host "Built build/NiceSwarm.exe ($mb MB)"

      # Sidecar checksum the game reads at launch to detect a newer build (GitHub's release
      # API does not expose asset hashes). Format: "<lowercase-sha256>  NiceSwarm.exe".
      - name: Compute exe SHA256 sidecar
        shell: pwsh
        run: |
          $hash = (Get-FileHash "build/NiceSwarm.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  NiceSwarm.exe" | Out-File -Encoding ascii -NoNewline "build/NiceSwarm.exe.sha256"
          Write-Host "sha256: $hash"

      # Debug build: same project, exported with the DEBUG template. Ships verbose error
      # reporting / stack traces and enables the in-game F1 debug panel (gated on
      # OS.is_debug_build()), so playtesters can file actionable bug reports. Same Start-Process
      # pattern as the release export above — a bare `godot ...` detaches and races silently.
      - name: Export Windows debug
        shell: pwsh
        run: |
          $p = Start-Process -FilePath godot -ArgumentList '--headless --path . --export-debug "Windows Desktop" "build/NiceSwarm-debug.exe"' -NoNewWindow -Wait -PassThru -RedirectStandardOutput godot-export-debug-out.txt -RedirectStandardError godot-export-debug-err.txt
          Get-Content godot-export-debug-out.txt, godot-export-debug-err.txt -ErrorAction SilentlyContinue
          Write-Host "godot --export-debug exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "godot debug export failed with exit code $($p.ExitCode)" }

      - name: Verify debug exe was produced
        shell: pwsh
        run: |
          if (-not (Test-Path "build/NiceSwarm-debug.exe")) {
            throw "Debug export failed - no exe produced (check debug export template)"
          }
          $mb = [math]::Round((Get-Item "build/NiceSwarm-debug.exe").Length / 1MB, 1)
          Write-Host "Built build/NiceSwarm-debug.exe ($mb MB)"

      # Debug exe gets its own sidecar so a running debug build checks for updates against the
      # right asset (see update_check.gd) instead of forever mismatching the release hash.
      - name: Compute debug exe SHA256 sidecar
        shell: pwsh
        run: |
          $hash = (Get-FileHash "build/NiceSwarm-debug.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  NiceSwarm-debug.exe" | Out-File -Encoding ascii -NoNewline "build/NiceSwarm-debug.exe.sha256"
          Write-Host "debug sha256: $hash"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NiceSwarm-windows
          path: |
            build/NiceSwarm.exe
            build/NiceSwarm.exe.sha256
            build/NiceSwarm-debug.exe
            build/NiceSwarm-debug.exe.sha256
          if-no-files-found: error

      - name: Publish versioned Release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/NiceSwarm.exe
            build/NiceSwarm.exe.sha256
            build/NiceSwarm-debug.exe
            build/NiceSwarm-debug.exe.sha256
          generate_release_notes: true

      - name: Publish rolling 'latest' prerelease (on publish branch)
        if: github.ref == 'refs/heads/publish'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (publish)
          body: Auto-built from the latest `publish` commit (${{ github.sha }}).
          prerelease: true
          files: |
            build/NiceSwarm.exe
            build/NiceSwarm.exe.sha256
            build/NiceSwarm-debug.exe
            build/NiceSwarm-debug.exe.sha256
