name: Build Windows EXE

# Builds the distributable Windows .exe (same steps as build.ps1) and publishes it.
# Runs on version tags (v*) -> attaches the exe to a GitHub Release,
# and on manual dispatch -> uploads the exe as a downloadable artifact.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # required for softprops/action-gh-release to create the release

jobs:
  export-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs the Godot editor + matching export templates. GDScript-only project,
      # so the non-.NET build is used. Bump `version` in lockstep with project.godot.
      - name: Set up Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: true

      # Best-effort: lets Godot patch Windows exe metadata (file_version/product_name
      # from export_presets.cfg). If the runner's Godot is self-contained this file is
      # ignored and the export simply skips metadata patching with a warning — never fatal.
      - name: Configure rcedit for exe metadata (best effort)
        continue-on-error: true
        shell: pwsh
        run: |
          curl -L -o rcedit.exe https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe
          $rcedit = ((Resolve-Path rcedit.exe).Path) -replace '\\','/'
          $dir = "$env:APPDATA\Godot"
          New-Item -ItemType Directory -Force $dir | Out-Null
          @"
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/windows/rcedit = "$rcedit"
          "@ | Out-File -Encoding utf8 "$dir\editor_settings-4.tres"

      # First run imports assets/resolves the global class_name cache (see CLAUDE.md);
      # the second run does the actual export. import can exit non-zero on benign
      # warnings, so don't gate the build on it.
      - name: Import project
        shell: pwsh
        run: godot --headless --path . --import; exit 0

      - name: Export Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          godot --headless --path . --export-release "Windows Desktop" "build/NiceSwarm.exe"

      - name: Verify exe was produced
        shell: pwsh
        run: |
          if (-not (Test-Path "build/NiceSwarm.exe")) {
            throw "Export failed - no exe produced (check export templates)"
          }
          $mb = [math]::Round((Get-Item "build/NiceSwarm.exe").Length / 1MB, 1)
          Write-Host "Built build/NiceSwarm.exe ($mb MB)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NiceSwarm-windows
          path: build/NiceSwarm.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/NiceSwarm.exe
          generate_release_notes: true
