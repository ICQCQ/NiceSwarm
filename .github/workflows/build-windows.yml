name: Build desktop binaries

# Builds the distributable desktop binaries and publishes them:
#   - Windows x86_64  (NiceSwarm.exe + NiceSwarm-debug.exe)
#   - Windows arm64   (NiceSwarm-arm64.exe)
#   - macOS universal (NiceSwarm-macos.zip, ad-hoc signed; one binary runs native on Intel + Apple Silicon)
# Runs on:
#   - push to `publish`  -> rolling "latest" prerelease (always-current dev build)
#   - version tags (v*)  -> attaches the binaries to a versioned GitHub Release
#   - manual dispatch    -> uploads the binaries as downloadable artifacts
# Two jobs: export-windows (windows-latest) and export-macos (macos-latest, needs
# export-windows so they don't race the `latest` release tag).

on:
  push:
    branches:
      - publish
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # required for softprops/action-gh-release to create the release

jobs:
  export-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — `git rev-list --count HEAD` needs every commit (a shallow clone returns 1)

      # CI builds bypass build.ps1, so stamp the build identity into BuildVersion the same way
      # build.ps1 does — otherwise the exe ships the committed "dev" placeholders. Bare SHA, no
      # -dirty marker: a fresh checkout is clean, and core.autocrlf=true on windows-latest would
      # otherwise flag every build dirty. BRANCH comes from GITHUB_REF_NAME ("publish" on the
      # branch push, "v1.2.3" on a tag) rather than `rev-parse --abbrev-ref` (which is "HEAD" on
      # the detached checkout CI uses). COUNT is the commit number; the headline version is then
      # "Publish v. <count>". Replace only the const lines so label()/full_label() are preserved.
      - name: Stamp build version into BuildVersion
        shell: pwsh
        run: |
          $commit = (git rev-parse --short HEAD)
          $branch = "${env:GITHUB_REF_NAME}"
          $count = (git rev-list --count HEAD)
          $bvFile = "scripts/config/build_version.gd"
          (Get-Content $bvFile -Raw) `
            -replace 'const COMMIT := "[^"]*"', "const COMMIT := `"$commit`"" `
            -replace 'const BRANCH := "[^"]*"', "const BRANCH := `"$branch`"" `
            -replace 'const COUNT := "[^"]*"', "const COUNT := `"$count`"" |
            Set-Content -Path $bvFile -NoNewline -Encoding ascii
          Write-Host "Build version: $branch v. $count ($commit)"
          Get-Content $bvFile

      # Publish the headline build-version label as a plain-text asset the launcher fetches
      # ("Publish v. 220") so it can show the user which game build it will install. Must match
      # BuildVersion.label() (uppercase first char only — NOT a multi-word title-case). Published
      # to the same rolling `latest`/versioned release as the binaries below.
      - name: Write VERSION.txt (build-version label for the launcher)
        shell: pwsh
        run: |
          $branch = "${env:GITHUB_REF_NAME}"
          $count = (git rev-list --count HEAD)
          $titled = if ($branch.Length -gt 0) { $branch.Substring(0,1).ToUpper() + $branch.Substring(1) } else { "Build" }
          $label = "$titled v. $count"
          New-Item -ItemType Directory -Force build | Out-Null
          $label | Out-File -Encoding ascii -NoNewline "build/VERSION.txt"
          Write-Host "VERSION.txt: $label"

      # Installs the Godot editor + matching export templates. GDScript-only project,
      # so the non-.NET build is used. Bump `version` in lockstep with project.godot.
      - name: Set up Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true

      # Best-effort: lets Godot patch Windows exe metadata (file_version/product_name
      # from export_presets.cfg). If the runner's Godot is self-contained this file is
      # ignored and the export simply skips metadata patching with a warning — never fatal.
      - name: Configure rcedit for exe metadata (best effort)
        continue-on-error: true
        shell: pwsh
        run: |
          curl -L -o rcedit.exe https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe
          $rcedit = ((Resolve-Path rcedit.exe).Path) -replace '\\','/'
          $dir = "$env:APPDATA\Godot"
          New-Item -ItemType Directory -Force $dir | Out-Null
          @"
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/windows/rcedit = "$rcedit"
          "@ | Out-File -Encoding utf8 "$dir\editor_settings-4.tres"

      # setup-godot symlinks `godot` to the GUI-subsystem Godot_*_win64.exe. Launched from
      # PowerShell that binary DETACHES and returns immediately, so a bare `godot ...` call
      # never blocks: the import races the export on .godot/, and the export hasn't finished
      # (or even started) when the verify step runs -> no exe, no output, ~1s, looks "silent".
      # Start-Process -Wait blocks on the process handle regardless of subsystem; redirecting
      # the streams to files (and printing them) keeps a real export error visible in one run.
      #
      # First run imports assets/resolves the global class_name cache (see CLAUDE.md); the
      # second run does the actual export. import can exit non-zero on benign warnings, so
      # don't gate the build on it.
      - name: Import project
        shell: pwsh
        run: |
          $p = Start-Process -FilePath godot -ArgumentList '--headless --path . --import' -NoNewWindow -Wait -PassThru -RedirectStandardOutput godot-import-out.txt -RedirectStandardError godot-import-err.txt
          Get-Content godot-import-out.txt, godot-import-err.txt -ErrorAction SilentlyContinue
          Write-Host "godot --import exit code: $($p.ExitCode)"
          exit 0

      - name: Export Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          $p = Start-Process -FilePath godot -ArgumentList '--headless --path . --export-release "Windows Desktop" "build/NiceSwarm.exe"' -NoNewWindow -Wait -PassThru -RedirectStandardOutput godot-export-out.txt -RedirectStandardError godot-export-err.txt
          Get-Content godot-export-out.txt, godot-export-err.txt -ErrorAction SilentlyContinue
          Write-Host "godot --export-release exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "godot export failed with exit code $($p.ExitCode)" }

      - name: Verify exe was produced
        shell: pwsh
        run: |
          if (-not (Test-Path "build/NiceSwarm.exe")) {
            throw "Export failed - no exe produced (check export templates)"
          }
          $mb = [math]::Round((Get-Item "build/NiceSwarm.exe").Length / 1MB, 1)
          Write-Host "Built build/NiceSwarm.exe ($mb MB)"

      # Sidecar checksum the game reads at launch to detect a newer build (GitHub's release
      # API does not expose asset hashes). Format: "<lowercase-sha256>  NiceSwarm.exe".
      - name: Compute exe SHA256 sidecar
        shell: pwsh
        run: |
          $hash = (Get-FileHash "build/NiceSwarm.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  NiceSwarm.exe" | Out-File -Encoding ascii -NoNewline "build/NiceSwarm.exe.sha256"
          Write-Host "sha256: $hash"

      # Debug build: same project, exported with the DEBUG template. Ships verbose error
      # reporting / stack traces and enables the in-game F1 debug panel (gated on
      # OS.is_debug_build()), so playtesters can file actionable bug reports. Same Start-Process
      # pattern as the release export above — a bare `godot ...` detaches and races silently.
      - name: Export Windows debug
        shell: pwsh
        run: |
          $p = Start-Process -FilePath godot -ArgumentList '--headless --path . --export-debug "Windows Desktop" "build/NiceSwarm-debug.exe"' -NoNewWindow -Wait -PassThru -RedirectStandardOutput godot-export-debug-out.txt -RedirectStandardError godot-export-debug-err.txt
          Get-Content godot-export-debug-out.txt, godot-export-debug-err.txt -ErrorAction SilentlyContinue
          Write-Host "godot --export-debug exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "godot debug export failed with exit code $($p.ExitCode)" }

      - name: Verify debug exe was produced
        shell: pwsh
        run: |
          if (-not (Test-Path "build/NiceSwarm-debug.exe")) {
            throw "Debug export failed - no exe produced (check debug export template)"
          }
          $mb = [math]::Round((Get-Item "build/NiceSwarm-debug.exe").Length / 1MB, 1)
          Write-Host "Built build/NiceSwarm-debug.exe ($mb MB)"

      # Debug exe gets its own sidecar so a running debug build checks for updates against the
      # right asset (see update_check.gd) instead of forever mismatching the release hash.
      - name: Compute debug exe SHA256 sidecar
        shell: pwsh
        run: |
          $hash = (Get-FileHash "build/NiceSwarm-debug.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  NiceSwarm-debug.exe" | Out-File -Encoding ascii -NoNewline "build/NiceSwarm-debug.exe.sha256"
          Write-Host "debug sha256: $hash"

      # Windows arm64 (release): cross-packaged from the x86_64 runner — the editor just bundles
      # the arm64 template, so the host arch doesn't matter. Official Windows-arm64 templates ship
      # since Godot 4.3. Same Start-Process detach workaround as the x86_64 exports above.
      - name: Export Windows arm64 release
        shell: pwsh
        run: |
          $p = Start-Process -FilePath godot -ArgumentList '--headless --path . --export-release "Windows Desktop arm64" "build/NiceSwarm-arm64.exe"' -NoNewWindow -Wait -PassThru -RedirectStandardOutput godot-export-arm-out.txt -RedirectStandardError godot-export-arm-err.txt
          Get-Content godot-export-arm-out.txt, godot-export-arm-err.txt -ErrorAction SilentlyContinue
          Write-Host "godot arm64 export exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "godot arm64 export failed with exit code $($p.ExitCode)" }

      - name: Verify arm64 exe was produced
        shell: pwsh
        run: |
          if (-not (Test-Path "build/NiceSwarm-arm64.exe")) {
            throw "arm64 export failed - no exe produced (check arm64 export template)"
          }
          $mb = [math]::Round((Get-Item "build/NiceSwarm-arm64.exe").Length / 1MB, 1)
          Write-Host "Built build/NiceSwarm-arm64.exe ($mb MB)"

      - name: Compute arm64 exe SHA256 sidecar
        shell: pwsh
        run: |
          $hash = (Get-FileHash "build/NiceSwarm-arm64.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  NiceSwarm-arm64.exe" | Out-File -Encoding ascii -NoNewline "build/NiceSwarm-arm64.exe.sha256"
          Write-Host "arm64 sha256: $hash"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NiceSwarm-windows
          path: |
            build/VERSION.txt
            build/NiceSwarm.exe
            build/NiceSwarm.exe.sha256
            build/NiceSwarm-debug.exe
            build/NiceSwarm-debug.exe.sha256
            build/NiceSwarm-arm64.exe
            build/NiceSwarm-arm64.exe.sha256
          if-no-files-found: error

      - name: Publish versioned Release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/VERSION.txt
            build/NiceSwarm.exe
            build/NiceSwarm.exe.sha256
            build/NiceSwarm-debug.exe
            build/NiceSwarm-debug.exe.sha256
            build/NiceSwarm-arm64.exe
            build/NiceSwarm-arm64.exe.sha256
          generate_release_notes: true

      - name: Publish rolling 'latest' prerelease (on publish branch)
        if: github.ref == 'refs/heads/publish'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (publish)
          body: Auto-built from the latest `publish` commit (${{ github.sha }}).
          prerelease: true
          files: |
            build/VERSION.txt
            build/NiceSwarm.exe
            build/NiceSwarm.exe.sha256
            build/NiceSwarm-debug.exe
            build/NiceSwarm-debug.exe.sha256
            build/NiceSwarm-arm64.exe
            build/NiceSwarm-arm64.exe.sha256

  # macOS: one job, one universal export, ad-hoc signed so it runs on Apple Silicon at all.
  # Plain foreground `run:` steps — unlike the Windows job there's no GUI-subsystem detach, so
  # no Start-Process dance. `needs: export-windows` serializes Release creation so the two jobs
  # don't race the `latest` tag.
  export-macos:
    runs-on: macos-latest
    needs: export-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — `git rev-list --count HEAD` needs every commit (a shallow clone returns 1)

      - name: Stamp build version into BuildVersion
        run: |
          commit=$(git rev-parse --short HEAD)
          branch="${GITHUB_REF_NAME}"
          count=$(git rev-list --count HEAD)
          sed -i '' -E "s/const COMMIT := \"[^\"]*\"/const COMMIT := \"$commit\"/" \
            scripts/config/build_version.gd
          sed -i '' -E "s/const BRANCH := \"[^\"]*\"/const BRANCH := \"$branch\"/" \
            scripts/config/build_version.gd
          sed -i '' -E "s/const COUNT := \"[^\"]*\"/const COUNT := \"$count\"/" \
            scripts/config/build_version.gd
          echo "Build version: $branch v. $count ($commit)"; cat scripts/config/build_version.gd

      - name: Set up Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: godot --headless --path . --import || true

      # ONE universal export — the stock Godot macOS template only ships a universal binary
      # (godot_macos_release.universal); a per-arch export (architecture="x86_64"/"arm64") makes
      # Godot look for godot_macos_release.<arch>, which doesn't exist → "Requested template
      # binary not found". A universal binary already runs native on both Intel and Apple Silicon,
      # so one zip covers everything. The game hashes its OWN inner Mach-O at runtime
      # (OS.get_executable_path() -> NiceSwarm.app/Contents/MacOS/NiceSwarm), so the sidecar must
      # hash that exact file, AFTER ad-hoc signing (the export does the signing) and BEFORE
      # zipping — hashing the .zip would never match the running build.
      - name: Export macOS universal (.zip, ad-hoc signed)
        run: |
          set -euo pipefail
          mkdir -p build
          out="build/NiceSwarm-macos.zip"
          godot --headless --path . --export-release "macOS" "$out"
          test -f "$out" || { echo "no zip produced"; exit 1; }
          mb=$(echo "scale=1; $(stat -f%z "$out")/1048576" | bc)
          echo "Built $out (${mb} MB)"
          rm -rf build/_u_macos && unzip -q "$out" -d build/_u_macos
          app=$(find build/_u_macos -maxdepth 1 -name '*.app' | head -n1)
          [ -n "$app" ] || { echo "no .app inside $out"; exit 1; }
          # Hash whatever single executable is actually in Contents/MacOS — Godot names it
          # after product_name ("NiceSwarm"), NOT the export-path basename, so don't guess.
          # _self_hash() hashes this exact (already ad-hoc-signed) binary at runtime.
          bin=$(find "$app/Contents/MacOS" -maxdepth 1 -type f | head -n1)
          [ -n "$bin" ] || { echo "no executable in $app/Contents/MacOS"; exit 1; }
          hash=$(shasum -a 256 "$bin" | awk '{print $1}')
          [ ${#hash} -eq 64 ] || { echo "bad/empty sha256 ($bin)"; exit 1; }
          printf '%s  NiceSwarm-macos.zip' "$hash" > "$out.sha256"
          echo "macOS universal inner-binary ($(basename "$bin")) sha256: $hash"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NiceSwarm-macos
          path: |
            build/NiceSwarm-macos.zip
            build/NiceSwarm-macos.zip.sha256
          if-no-files-found: error

      - name: Publish versioned Release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/NiceSwarm-macos.zip
            build/NiceSwarm-macos.zip.sha256

      # Only append the mac assets — the export-windows job already created/named the `latest`
      # release. Omitting name/body here avoids blanking the body that job wrote.
      - name: Publish rolling 'latest' prerelease (on publish branch)
        if: github.ref == 'refs/heads/publish'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          prerelease: true
          files: |
            build/NiceSwarm-macos.zip
            build/NiceSwarm-macos.zip.sha256
